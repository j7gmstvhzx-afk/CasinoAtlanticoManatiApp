name: Seed Database

on:
  workflow_dispatch:

# Least-privilege: read-only repo access. The job holds SUPABASE_SERVICE_ROLE_KEY
# (bypasses all RLS), so it is gated behind the protected `production`
# Environment (configure required reviewers + branch restriction under
# Settings → Environments → production).
permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Pinned to full commit SHAs (actions/checkout v4.2.2, setup-node v4.1.0)
      # so a moved tag can't run code in a job holding the service-role key.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '20'

      # --ignore-scripts blocks arbitrary lifecycle scripts from dependencies
      # from executing in the same job that holds the service-role key.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Upload seed data to Supabase
        run: npx tsx scripts/migrate-seed-to-supabase.ts
        env:
          EXPO_PUBLIC_SUPABASE_URL:  ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
